# Без цього файлу pytest піднімається до agenthw/pyproject.toml і
# успадковує звідти чужі addopts (зокрема -q: разом із вашим -q це
# подвійний quiet, у якому зникає навіть рядок «N passed») та
# asyncio_mode, якого тутешнє оточення не знає. Власний конфіг
# зупиняє пошук: rootdir — цей каталог.
[pytest]
addopts = -ra
