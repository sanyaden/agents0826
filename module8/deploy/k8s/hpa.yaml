# Автоскейл за CPU — найпростіший, і саме тому ПОГАНИЙ сигнал для агентів:
# вони більшість часу чекають на модель, CPU при цьому спить. У проді
# масштабують за глибиною черги (KEDA). Цей файл — щоб побачити механіку.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentpro
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: agentpro}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
